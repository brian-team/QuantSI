name: Benchmarks

on: [push, pull_request]

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-24.04

    steps:
    - name: Check out the repository
      uses: actions/checkout@v7

    - name: Set up PDM
      uses: pdm-project/setup-pdm@v4
      with:
        python-version: 3.13

    - name: Install dependencies
      run: |
        pdm install -G test

    # Timings on shared CI runners are noisy, so we only save them as an artifact.
    # To look into a slowdown, compare the files of two runs.
    - name: Run benchmarks
      run: |
        pdm run pytest tests/benchmarks --benchmark-enable --benchmark-only --benchmark-json=benchmarks.json

    - name: Check overhead against plain NumPy
      run: |
        pdm run pytest -m perf_guard -v

    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: benchmarks
        path: benchmarks.json
